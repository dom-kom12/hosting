<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Zarządzanie serwerem Minecraft</title>
  <style>
    body {
      background: #0f0f1b;
      color: #00ffff;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding: 20px;
      transition: background-color 0.3s, color 0.3s;
    }
    h1 {
      color: #00ff99;
      text-shadow: 0 0 10px #00ffcc;
    }
    button {
      background-color: #111;
      color: #00ffff;
      border: 1px solid #00ffff;
      padding: 10px 20px;
      margin: 5px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover {
      background-color: #00ffff;
      color: #000;
    }
    textarea {
      width: 90%;
      height: 300px;
      background-color: #111;
      color: #0f0;
      border: 1px solid #0f0;
      padding: 10px;
      margin-top: 10px;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 20px auto;
      max-width: 800px;
      text-align: left;
    }
    li {
      padding: 5px;
      border-bottom: 1px solid #00ffff55;
      cursor: pointer;
    }
    li:hover {
      background-color: #001f1f;
    }
    input {
      background-color: #111;
      color: #0f0;
      border: 1px solid #0f0;
      padding: 5px;
      margin: 5px;
    }
    #nightMode {
      background-color: #ff6666;
      color: #000;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 20px;
    }
    #nightMode.active {
      background-color: #00ffff;
      color: #000;
    }
  </style>
</head>
<body>
  <h1>🧠 Minecraft Server Manager (Neon Style)</h1>

  <button onclick="pickServerFolder()">📁 Wybierz folder serwera</button>
  <button onclick="promptNewFile()">📄 Nowy plik</button>
  <button onclick="promptNewFolder()">📁 Nowy folder</button>
  <button onclick="deleteCurrent()">🗑️ Usuń plik/folder</button>

  <h3>Ustawienia uruchamiania serwera</h3>
  <label>RAM (np. 1G, 512M): </label>
  <input type="text" id="ramAmount" value="2G">
  <label>Plik JAR: </label>
  <input type="text" id="jarFile" value="server.jar">

  <div id="container">
    <h3>Pliki serwera:</h3>
    <ul id="fileList"></ul>
    <textarea id="fileContent" style="display:none;"></textarea><br>
    <button onclick="saveFile()" id="saveBtn" style="display:none;">💾 Zapisz</button>
    <br><br>
    <button onclick="startServer()">⚡ Uruchom serwer</button>
  </div>

  <button id="nightMode" onclick="toggleNightMode()">🌙 Tryb nocny</button>

  <script>
    let rootDirHandle = null;
    let currentFileHandle = null;

    async function pickServerFolder() {
      rootDirHandle = await window.showDirectoryPicker();
      listFiles();
    }

    async function listFiles() {
      const list = document.getElementById("fileList");
      list.innerHTML = "";

      async function traverse(dir, indent = "") {
        for await (const entry of dir.values()) {
          const item = document.createElement("li");
          item.textContent = indent + (entry.kind === "directory" ? "📁 " : "📄 ") + entry.name;
          item.onclick = () => {
            if (entry.kind === "file") {
              openFile(entry);
            }
          };
          list.appendChild(item);

          if (entry.kind === "directory") {
            const subdir = await dir.getDirectoryHandle(entry.name);
            await traverse(subdir, indent + " ");
          }
        }
      }

      await traverse(rootDirHandle);
    }

    async function openFile(fileHandle) {
      currentFileHandle = fileHandle.name;
      const file = await rootDirHandle.getFileHandle(fileHandle.name);
      const content = await (await file.getFile()).text();
      document.getElementById("fileContent").value = content;
      document.getElementById("fileContent").style.display = "block";
      document.getElementById("saveBtn").style.display = "inline";
    }

    async function saveFile() {
      if (!currentFileHandle) return;
      const fileHandle = await rootDirHandle.getFileHandle(currentFileHandle, { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(document.getElementById("fileContent").value);
      await writable.close();
      alert("Zapisano!");
    }

    async function promptNewFile() {
      if (!rootDirHandle) return alert("Najpierw wybierz folder serwera!");
      const fileName = prompt("Nazwa nowego pliku:");
      if (!fileName) return;
      const fileHandle = await rootDirHandle.getFileHandle(fileName, { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write("");
      await writable.close();
      listFiles();
    }

    async function promptNewFolder() {
      if (!rootDirHandle) return alert("Najpierw wybierz folder serwera!");
      const folderName = prompt("Nazwa nowego folderu:");
      if (!folderName) return;
      await rootDirHandle.getDirectoryHandle(folderName, { create: true });
      listFiles();
    }

    async function deleteCurrent() {
      if (!rootDirHandle || !currentFileHandle) {
        alert("Najpierw wybierz plik do usunięcia!");
        return;
      }
      const confirmed = confirm("Na pewno usunąć " + currentFileHandle + "?");
      if (!confirmed) return;
      await rootDirHandle.removeEntry(currentFileHandle);
      currentFileHandle = null;
      document.getElementById("fileContent").style.display = "none";
      document.getElementById("saveBtn").style.display = "none";
      listFiles();
    }

    async function startServer() {
      const jarFile = document.getElementById("jarFile").value || "server.jar";
      const ramAmount = document.getElementById("ramAmount").value || "2G";

      alert(`Uruchamiam serwer Minecraft z plikiem: ${jarFile} z RAM: ${ramAmount}`);

      const serverStartContent = `java -Xmx${ramAmount} -Xms${ramAmount} -jar ${jarFile} nogui`;
      const serverStartFile = await rootDirHandle.getFileHandle("startServer.sh", { create: true });
      const writable = await serverStartFile.createWritable();
      await writable.write(serverStartContent);
      await writable.close();
      alert("Plik startServer.sh utworzony. Użyj go do uruchomienia serwera.");
    }

    function toggleNightMode() {
      const body = document.querySelector("body");
      const nightModeButton = document.getElementById("nightMode");
      body.classList.toggle("night");
      nightModeButton.classList.toggle("active");
      if (body.classList.contains("night")) {
        body.style.backgroundColor = "#111";
        body.style.color = "#fff";
      } else {
        body.style.backgroundColor = "#0f0f1b";
        body.style.color = "#00ffff";
      }
    }
  </script>
</body>
</html>
